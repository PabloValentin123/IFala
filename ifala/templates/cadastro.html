<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar conta — IFala</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

<main class="login-page">
    <section class="login-card">
        <div class="logo">IFala</div>
        <h1>Criar conta</h1>
        <p class="subtitulo">
            Suas reclamações ficam sem nome para os outros usuários,
            mas a administração consegue ver quem as enviou.
        </p>

        {% if erro %}
            <div class="erro">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="/cadastro">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" maxlength="100" autocomplete="name" required>

            <label for="matricula">Matrícula</label>
            <input type="text" id="matricula" name="matricula" maxlength="30" autocomplete="username" required>

            <label for="senha">Senha (mínimo 6 caracteres)</label>
            <input type="password" id="senha" name="senha" minlength="6" autocomplete="new-password" required>

            <button type="submit">Criar conta</button>
        </form>

        <a class="voltar" href="/entrar">← Já tenho conta</a>
    </section>
</main>

<footer>
    <p>Instituto Federal do Rio Grande do Norte — IFala</p>
</footer>

</body>
</html>
